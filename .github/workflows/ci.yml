name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    name: smoke-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Builds Stratum, generates every service variant, builds them (warnings as errors + NuGet audit),
      # runs one and checks the common contract, then builds and tests the full variants.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: bash ./scripts/smoke-test.sh

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test.ps1
