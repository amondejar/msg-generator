# Local development database: docker compose up -d
# Connection string for it is in src/{{Service}}.Api/appsettings.Development.json.
services:
  db:
    # @msg:if postgres
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: {{service-kebab}}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    # @msg:else
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Msg_Dev_Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    # @msg:end

volumes:
  db-data:
