name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # @msg:if tests
      - name: Test
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage"
      # @msg:end

      # @msg:if docker
      - name: Docker image
        run: docker build -t {{service-kebab}}:${{ github.sha }} .
      # @msg:end
